name: Sitemap

on:
  push:
    branches:
      - main

jobs:
  mi-trabajo:
    runs-on: ubuntu-latest

    steps:
      # 1. Paso obligatorio: Descargar el código de tu repositorio para que la acción pueda leerlo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Generar el sitemap usando la acción de Guimauve Digital
      - name: Generate sitemap
        uses: guimauvedigital/generate-sitemap@v1
        with:
          base_url: "https://verdestro.github.io/La-Carta-sitio-oficial-de-Absurdo-Gerundio/"
          output_path: "public/sitemap.xml"
          input_dir: "public"
